<!DOCTYPE html>
<html>
<head>
  <title>Drake Tiny Wake Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>

  <style>
    body{
      margin:0;
      background:#05070d;
      color:white;
      font-family:Arial;
      padding:14px;
    }

    button{
      padding:12px 16px;
      border:0;
      border-radius:10px;
      background:#2d6cdf;
      color:white;
      font-weight:900;
      margin:5px;
      cursor:pointer;
      font-size:14px;
    }

    .green{background:#009b5a}
    .red{background:#b91c1c}
    .gray{background:#333844}

    #wake{
      font-size:28px;
      font-weight:900;
      color:#ff4444;
      margin:12px 0;
    }

    #status{
      color:#9fd3ff;
      font-weight:900;
      margin:10px 0;
    }

    #debug{
      background:#000;
      color:#00ff88;
      height:45vh;
      overflow:auto;
      padding:12px;
      border-radius:10px;
      font-family:Consolas;
      font-size:12px;
      white-space:pre-wrap;
    }

    input{
      margin:8px 0;
      display:block;
    }
  </style>
</head>

<body>

<h2>Drake Tiny Wake Trainer</h2>

<button onclick="initMic()">INIT MIC</button>

<button class="green" onclick="recordSample('drake')">
  RECORD DRAKE SAMPLE
</button>

<button class="gray" onclick="recordSample('noise')">
  RECORD NOISE SAMPLE
</button>

<button onclick="trainModel()">TRAIN</button>

<button class="green" onclick="startDetect()">
  START DETECT
</button>

<button class="red" onclick="stopDetect()">
  STOP
</button>

<br><br>

<button onclick="saveLocal()">
  SAVE LOCAL
</button>

<button onclick="loadLocal()">
  LOAD LOCAL
</button>

<button onclick="downloadModel()">
  DOWNLOAD MODEL FILES
</button>

<input
  type="file"
  id="modelFiles"
  multiple
  accept=".json,.bin"
/>

<button onclick="loadModelFiles()">
  LOAD MODEL FILES
</button>

<div id="wake">NOT DETECTED</div>

<div id="status">idle</div>

<pre id="debug"></pre>

<script>

let stream;
let audioCtx;
let analyser;
let data;

let samples = [];

let model = null;

let detecting = false;

const FEATURE_SIZE = 64;

const RECORD_MS = 900;

const THRESHOLD = 0.82;

function log(x){
  debug.textContent += `[${new Date().toLocaleTimeString()}] ${x}\n`;
  debug.scrollTop = debug.scrollHeight;
  console.log(x);
}

function setStatus(x){
  status.innerText = x;
}

function setWake(ok, score=0){

  wake.innerText = ok
    ? `DRAKE DETECTED ✅ ${score.toFixed(2)}`
    : `NOT DETECTED ${score.toFixed(2)}`;

  wake.style.color = ok
    ? "#00ff88"
    : "#ff4444";
}

async function initMic(){

  stream = await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:false,
      noiseSuppression:false,
      autoGainControl:false
    }
  });

  audioCtx = new AudioContext();

  const src =
    audioCtx.createMediaStreamSource(stream);

  analyser = audioCtx.createAnalyser();

  analyser.fftSize = 2048;

  data = new Float32Array(
    analyser.frequencyBinCount
  );

  src.connect(analyser);

  log("Mic ready ✅");

  setStatus("mic ready");
}

async function recordSample(label){

  if(!analyser){
    alert("Init mic first");
    return;
  }

  setStatus("recording " + label);

  log("Recording " + label + "...");

  const feat = await captureFeature();

  samples.push({
    label,
    feature: feat
  });

  log(
    `Saved ${label} sample. Total: ${samples.length}`
  );

  setStatus(`saved ${label}`);
}

async function captureFeature(){

  const frames = [];

  const start = Date.now();

  while(Date.now() - start < RECORD_MS){

    analyser.getFloatFrequencyData(data);

    const feature =
      downsampleFFT(data, FEATURE_SIZE);

    frames.push(feature);

    await wait(50);
  }

  return averageFrames(frames);
}

function downsampleFFT(arr, size){

  const out = new Array(size).fill(0);

  const step =
    Math.floor(arr.length / size);

  for(let i=0;i<size;i++){

    let sum = 0;

    for(let j=0;j<step;j++){

      let v = arr[i * step + j];

      if(!isFinite(v)) v = -100;

      sum += v;
    }

    let avg = sum / step;

    out[i] =
      Math.max(
        0,
        Math.min(1, (avg + 100) / 100)
      );
  }

  return out;
}

function averageFrames(frames){

  const out =
    new Array(FEATURE_SIZE).fill(0);

  for(const f of frames){

    for(let i=0;i<FEATURE_SIZE;i++){
      out[i] += f[i];
    }
  }

  for(let i=0;i<FEATURE_SIZE;i++){
    out[i] /= frames.length;
  }

  return out;
}

async function trainModel(){

  const drakeCount =
    samples.filter(s=>s.label==="drake").length;

  const noiseCount =
    samples.filter(s=>s.label==="noise").length;

  if(drakeCount < 5 || noiseCount < 5){

    alert(
      "Record at least 5 Drake and 5 Noise samples"
    );

    return;
  }

  setStatus("training");

  log("Training tiny model...");

  const xs =
    tf.tensor2d(samples.map(s=>s.feature));

  const ys =
    tf.tensor2d(
      samples.map(s =>
        s.label==="drake" ? [1] : [0]
      )
    );

  model = tf.sequential();

  model.add(tf.layers.dense({
    inputShape:[FEATURE_SIZE],
    units:32,
    activation:"relu"
  }));

  model.add(tf.layers.dropout({
    rate:0.2
  }));

  model.add(tf.layers.dense({
    units:16,
    activation:"relu"
  }));

  model.add(tf.layers.dense({
    units:1,
    activation:"sigmoid"
  }));

  model.compile({
    optimizer:tf.train.adam(0.01),
    loss:"binaryCrossentropy",
    metrics:["accuracy"]
  });

  await model.fit(xs, ys, {
    epochs:45,
    shuffle:true,
    callbacks:{
      onEpochEnd:(epoch, logs)=>{

        if(epoch % 10 === 0){

          log(
            `epoch ${epoch} loss=${logs.loss.toFixed(3)} acc=${(logs.acc || logs.accuracy).toFixed(3)}`
          );
        }
      }
    }
  });

  xs.dispose();
  ys.dispose();

  log("Training done ✅");

  setStatus("trained");
}

async function startDetect(){

  if(!model){
    alert("Train or load model first");
    return;
  }

  detecting = true;

  setStatus("detecting");

  log("Detection started");

  while(detecting){

    const feat =
      await captureFeature();

    const pred =
      model.predict(tf.tensor2d([feat]));

    const score =
      (await pred.data())[0];

    pred.dispose();

    if(score > THRESHOLD){

      setWake(true, score);

      log(
        "WAKE ✅ score=" +
        score.toFixed(3)
      );

    }else{

      setWake(false, score);
    }

    await wait(120);
  }
}

function stopDetect(){

  detecting = false;

  setStatus("stopped");

  log("Stopped");
}

async function saveLocal(){

  if(!model){
    alert("Train model first");
    return;
  }

  await model.save(
    "localstorage://drake-wake-model"
  );

  localStorage.setItem(
    "drake-wake-samples",
    JSON.stringify(samples)
  );

  log("Model saved locally ✅");
}

async function loadLocal(){

  try{

    model =
      await tf.loadLayersModel(
        "localstorage://drake-wake-model"
      );

    const saved =
      localStorage.getItem(
        "drake-wake-samples"
      );

    if(saved){
      samples = JSON.parse(saved);
    }

    log("Local model loaded ✅");

    setStatus("model loaded");

  }catch(e){

    log("Load local error: " + e.message);
  }
}

async function downloadModel(){

  if(!model){
    alert("Train model first");
    return;
  }

  await model.save(
    "downloads://drake-wake-model"
  );

  log(
    "Downloaded model.json + weights.bin ✅"
  );
}

async function loadModelFiles(){

  const files =
    document.getElementById("modelFiles").files;

  if(files.length < 2){

    alert(
      "Select both model.json and weights.bin"
    );

    return;
  }

  try{

    model =
      await tf.loadLayersModel(
        tf.io.browserFiles([...files])
      );

    log("Model files loaded ✅");

    setStatus("model loaded");

  }catch(e){

    log(
      "Load model files error: " +
      e.message
    );
  }
}

function wait(ms){
  return new Promise(r=>setTimeout(r,ms));
}

log(`
FLOW:

1. INIT MIC
2. Record 15-30 DRAKE samples
3. Record 15-30 NOISE samples
4. TRAIN
5. TEST DETECTION
6. DOWNLOAD MODEL FILES
`);

</script>

</body>
</html>
