<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gla Board - Gesture Capture</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 14px 0 5px;
      font-size: 28px;
    }

    p {
      color: #aaa;
      margin: 5px 15px 15px;
      font-size: 14px;
    }

    .section {
      width: 95%;
      max-width: 900px;
      margin: 15px auto;
      padding: 15px;
      background: #151515;
      border-radius: 14px;
      border: 1px solid #333;
    }

    .camera-box {
      position: relative;
      width: 100%;
      max-width: 850px;
      margin: auto;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
      background: black;
    }

    video,
    canvas {
      width: 100%;
      max-width: 850px;
      border-radius: 12px;
      background: black;
      border: 1px solid #333;
    }

    #video {
      display: block;
      border: none;
      border-radius: 0;
    }

    #overlayCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      pointer-events: none;
      border-radius: 0;
    }

    button {
      margin: 7px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #9b5cff;
    }

    button.secondary {
      background: #333;
    }

    button.danger {
      background: #b91c1c;
    }

    #middleCaptureBtn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 155px;
      height: 155px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.88);
      border: 4px solid white;
      color: white;
      font-size: 18px;
      font-weight: bold;
      z-index: 10;
      box-shadow: 0 0 35px rgba(124, 58, 237, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
      padding: 10px;
      pointer-events: none;
      user-select: none;
    }

    #middleCaptureBtn.hidden {
      display: none;
    }

    .controls {
      margin: 15px auto;
      max-width: 700px;
      text-align: left;
    }

    label {
      display: block;
      margin-top: 12px;
      color: #ccc;
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
    }

    .status {
      color: #00ff99;
      margin-top: 10px;
      font-size: 14px;
      min-height: 22px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    @media (min-width: 800px) {
      .preview-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>Gla Board</h1>
  <p>
    Show full hand first, then only index finger to trigger a 3-second capture.
    First capture = blank glass, second capture = written glass.
  </p>

  <div class="section">
    <h2>Camera</h2>

    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlayCanvas"></canvas>

      <div id="middleCaptureBtn">
        Show<br>Palm
      </div>
    </div>

    <br>

    <button class="secondary" onclick="toggleMiddleButton()">Toggle Middle Button</button>
    <button onclick="saveWhiteboard()">Save Whiteboard</button>
    <button class="danger" onclick="resetAll()">Reset</button>

    <div class="status" id="status">Starting camera and hand tracking...</div>
  </div>

  <div class="section">
    <h2>Adjust Detection</h2>

    <div class="controls">
      <label>Difference Sensitivity: <span id="thresholdValue">45</span></label>
      <input type="range" id="threshold" min="5" max="120" value="45" oninput="updateAndProcess()" />

      <label>Dark Ink Boost: <span id="darkBoostValue">35</span></label>
      <input type="range" id="darkBoost" min="0" max="120" value="35" oninput="updateAndProcess()" />

      <label>Noise Removal: <span id="noiseValue">2</span></label>
      <input type="range" id="noise" min="0" max="5" value="2" oninput="updateAndProcess()" />

      <label>
        <input type="checkbox" id="mirrorOutput" onchange="updateAndProcess()" />
        Mirror output
      </label>

      <label>
        <input type="checkbox" id="blackInk" checked onchange="updateAndProcess()" />
        Show writing as black ink
      </label>

      <label>
        <input type="checkbox" id="showLandmarks" checked />
        Show hand landmarks
      </label>
    </div>
  </div>

  <div class="section">
    <h2>Photos</h2>

    <div class="preview-grid">
      <div>
        <h3>Blank Glass</h3>
        <canvas id="blankCanvas"></canvas>
      </div>

      <div>
        <h3>Written Glass</h3>
        <canvas id="writtenCanvas"></canvas>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Final Whiteboard</h2>
    <canvas id="outputCanvas"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <script>
    const video = document.getElementById("video");
    const overlayCanvas = document.getElementById("overlayCanvas");
    const blankCanvas = document.getElementById("blankCanvas");
    const writtenCanvas = document.getElementById("writtenCanvas");
    const outputCanvas = document.getElementById("outputCanvas");

    const overlayCtx = overlayCanvas.getContext("2d");
    const statusText = document.getElementById("status");
    const middleCaptureBtn = document.getElementById("middleCaptureBtn");

    const thresholdSlider = document.getElementById("threshold");
    const darkBoostSlider = document.getElementById("darkBoost");
    const noiseSlider = document.getElementById("noise");

    const thresholdValue = document.getElementById("thresholdValue");
    const darkBoostValue = document.getElementById("darkBoostValue");
    const noiseValue = document.getElementById("noiseValue");

    let hasBlank = false;
    let hasWritten = false;
    let captureStep = 1; // 1 = blank, 2 = written
    let middleButtonVisible = true;

    let countdownActive = false;
    let armed = false;
    let armedAt = 0;
    let openPalmFrames = 0;
    let onlyIndexFrames = 0;

    const PALM_STABLE_FRAMES = 6;
    const INDEX_STABLE_FRAMES = 6;
    const ARM_TIMEOUT_MS = 5000;

    let audioCtx = null;

    function unlockAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {}
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    document.body.addEventListener("click", unlockAudio, { once: false });
    document.body.addEventListener("touchstart", unlockAudio, { once: false });

    function beep(freq = 880, duration = 0.12, volume = 0.08) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.value = volume;

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();

      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function setupCanvases() {
      const w = video.videoWidth || 1280;
      const h = video.videoHeight || 720;

      [overlayCanvas, blankCanvas, writtenCanvas, outputCanvas].forEach(canvas => {
        canvas.width = w;
        canvas.height = h;
      });
    }

    function drawVideoToCanvas(canvas) {
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }

    function toggleMiddleButton() {
      middleButtonVisible = !middleButtonVisible;
      middleCaptureBtn.classList.toggle("hidden", !middleButtonVisible);
    }

    function updateBubbleText(text) {
      middleCaptureBtn.innerHTML = text;
    }

    function updateMainInstruction() {
      if (countdownActive) return;

      if (captureStep === 1) {
        if (!armed) {
          updateBubbleText("Show<br>Palm");
          statusText.textContent = "Step 1: Show full hand to arm blank-glass capture.";
        } else {
          updateBubbleText("Show<br>Index");
          statusText.textContent = "Blank capture armed. Now show only index finger within 5 sec.";
        }
      } else {
        if (!armed) {
          updateBubbleText("Show<br>Palm");
          statusText.textContent = "Step 2: Now write on the glass. Then show full hand to arm second capture.";
        } else {
          updateBubbleText("Show<br>Index");
          statusText.textContent = "Written capture armed. Now show only index finger within 5 sec.";
        }
      }
    }

    function resetArming() {
      armed = false;
      armedAt = 0;
      openPalmFrames = 0;
      onlyIndexFrames = 0;
      updateMainInstruction();
    }

    function isFingerUp(landmarks, tipIndex, pipIndex) {
      return landmarks[tipIndex].y < landmarks[pipIndex].y;
    }

    function distance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function detectOpenPalm(landmarks) {
      const indexUp = isFingerUp(landmarks, 8, 6);
      const middleUp = isFingerUp(landmarks, 12, 10);
      const ringUp = isFingerUp(landmarks, 16, 14);
      const pinkyUp = isFingerUp(landmarks, 20, 18);

      const handWidth = distance(landmarks[5], landmarks[17]);
      const handHeight = distance(landmarks[0], landmarks[9]);

      return indexUp && middleUp && ringUp && pinkyUp && handWidth > handHeight * 0.45;
    }

    function detectOnlyIndex(landmarks) {
      const indexUp = isFingerUp(landmarks, 8, 6);
      const middleUp = isFingerUp(landmarks, 12, 10);
      const ringUp = isFingerUp(landmarks, 16, 14);
      const pinkyUp = isFingerUp(landmarks, 20, 18);

      return indexUp && !middleUp && !ringUp && !pinkyUp;
    }

    function startCountdown() {
      if (countdownActive) return;

      countdownActive = true;
      armed = false;
      openPalmFrames = 0;
      onlyIndexFrames = 0;

      let count = 3;
      updateBubbleText(count);
      statusText.textContent =
        `Capturing ${captureStep === 1 ? "blank glass" : "written glass"} in ${count}...`;

      beep(900, 0.14, 0.09);

      const timer = setInterval(() => {
        count--;

        if (count > 0) {
          updateBubbleText(count);
          statusText.textContent =
            `Capturing ${captureStep === 1 ? "blank glass" : "written glass"} in ${count}...`;
          beep(900, 0.14, 0.09);
        } else {
          clearInterval(timer);
          updateBubbleText("Snap!");
          beep(1250, 0.22, 0.12);

          setTimeout(() => {
            doCapture();
            countdownActive = false;
            updateMainInstruction();
          }, 180);
        }
      }, 1000);
    }

    function doCapture() {
      setupCanvases();

      if (captureStep === 1) {
        drawVideoToCanvas(blankCanvas);
        hasBlank = true;
        captureStep = 2;

        statusText.textContent =
          "Blank glass captured. Now write on the glass, then show full hand and only index again.";
        updateBubbleText("Captured");
        setTimeout(updateMainInstruction, 800);
      } else {
        drawVideoToCanvas(writtenCanvas);
        hasWritten = true;

        statusText.textContent = "Written glass captured. Generating whiteboard...";
        processBoard();

        updateBubbleText("Done");
        setTimeout(() => {
          statusText.textContent = "Whiteboard generated. You can save it or reset for another scan.";
          updateBubbleText("Done");
        }, 400);
      }
    }

    function updateAndProcess() {
      thresholdValue.textContent = thresholdSlider.value;
      darkBoostValue.textContent = darkBoostSlider.value;
      noiseValue.textContent = noiseSlider.value;

      if (hasBlank && hasWritten) {
        processBoard();
      }
    }

    function cleanNoise(mask, w, h, strength) {
      if (strength <= 0) return mask;

      let result = new Uint8Array(mask);

      for (let pass = 0; pass < strength; pass++) {
        const temp = new Uint8Array(result);

        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const index = y * w + x;
            let count = 0;

            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                const nIndex = (y + dy) * w + (x + dx);
                if (result[nIndex] > 0) count++;
              }
            }

            if (count <= 2) temp[index] = 0;
            if (count >= 5) temp[index] = 255;
          }
        }

        result = temp;
      }

      return result;
    }

    function processBoard() {
      if (!hasBlank || !hasWritten) return;

      const w = blankCanvas.width;
      const h = blankCanvas.height;

      const blankCtx = blankCanvas.getContext("2d");
      const writtenCtx = writtenCanvas.getContext("2d");
      const outputCtx = outputCanvas.getContext("2d");

      const blankData = blankCtx.getImageData(0, 0, w, h);
      const writtenData = writtenCtx.getImageData(0, 0, w, h);
      const outputData = outputCtx.createImageData(w, h);

      const threshold = parseInt(thresholdSlider.value);
      const darkBoost = parseInt(darkBoostSlider.value);
      const blackInk = document.getElementById("blackInk").checked;
      const mirrorOutput = document.getElementById("mirrorOutput").checked;

      let mask = new Uint8Array(w * h);

      for (let i = 0; i < blankData.data.length; i += 4) {
        const index = i / 4;

        const br = blankData.data[i];
        const bg = blankData.data[i + 1];
        const bb = blankData.data[i + 2];

        const wr = writtenData.data[i];
        const wg = writtenData.data[i + 1];
        const wb = writtenData.data[i + 2];

        const blankGray = (br + bg + bb) / 3;
        const writtenGray = (wr + wg + wb) / 3;

        const diff =
          Math.abs(wr - br) +
          Math.abs(wg - bg) +
          Math.abs(wb - bb);

        const becameDarker = blankGray - writtenGray;

        if (diff > threshold || becameDarker > darkBoost) {
          mask[index] = 255;
        } else {
          mask[index] = 0;
        }
      }

      mask = cleanNoise(mask, w, h, parseInt(noiseSlider.value));

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let sourceX = x;
          if (mirrorOutput) sourceX = w - x - 1;

          const srcIndex = y * w + sourceX;
          const outIndex = (y * w + x) * 4;
          const isWriting = mask[srcIndex] > 0;

          if (isWriting) {
            if (blackInk) {
              outputData.data[outIndex] = 0;
              outputData.data[outIndex + 1] = 0;
              outputData.data[outIndex + 2] = 0;
            } else {
              outputData.data[outIndex] = 124;
              outputData.data[outIndex + 1] = 58;
              outputData.data[outIndex + 2] = 237;
            }
          } else {
            outputData.data[outIndex] = 255;
            outputData.data[outIndex + 1] = 255;
            outputData.data[outIndex + 2] = 255;
          }

          outputData.data[outIndex + 3] = 255;
        }
      }

      outputCtx.putImageData(outputData, 0, 0);
    }

    function saveWhiteboard() {
      if (!hasBlank || !hasWritten) {
        alert("Capture both photos first.");
        return;
      }

      const link = document.createElement("a");
      link.download = "gla-board-whiteboard.png";
      link.href = outputCanvas.toDataURL("image/png");
      link.click();
    }

    function resetAll() {
      [blankCanvas, writtenCanvas, outputCanvas, overlayCanvas].forEach(canvas => {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });

      hasBlank = false;
      hasWritten = false;
      captureStep = 1;
      countdownActive = false;
      resetArming();

      statusText.textContent = "Reset done. Show full hand to start blank-glass capture again.";
      updateBubbleText("Show<br>Palm");
    }

    function drawHandResults(results) {
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      if (!document.getElementById("showLandmarks").checked) return;
      if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) return;

      for (const landmarks of results.multiHandLandmarks) {
        drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS, {
          color: "#00FF99",
          lineWidth: 3
        });
        drawLandmarks(overlayCtx, landmarks, {
          color: "#7c3aed",
          lineWidth: 1,
          radius: 4
        });
      }
    }

    function handleGesture(results) {
      if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
        openPalmFrames = 0;
        onlyIndexFrames = 0;

        if (armed && Date.now() - armedAt > ARM_TIMEOUT_MS) {
          resetArming();
        }
        return;
      }

      if (countdownActive) return;

      const landmarks = results.multiHandLandmarks[0];
      const isPalm = detectOpenPalm(landmarks);
      const isOnlyIdx = detectOnlyIndex(landmarks);

      if (!armed) {
        if (isPalm) {
          openPalmFrames++;
          if (openPalmFrames >= PALM_STABLE_FRAMES) {
            armed = true;
            armedAt = Date.now();
            openPalmFrames = 0;
            onlyIndexFrames = 0;
            beep(700, 0.1, 0.07);
            updateMainInstruction();
          }
        } else {
          openPalmFrames = 0;
        }
      } else {
        if (Date.now() - armedAt > ARM_TIMEOUT_MS) {
          resetArming();
          return;
        }

        if (isOnlyIdx) {
          onlyIndexFrames++;
          if (onlyIndexFrames >= INDEX_STABLE_FRAMES) {
            startCountdown();
            onlyIndexFrames = 0;
          }
        } else {
          onlyIndexFrames = 0;
        }
      }
    }

    async function startEverything() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async () => {
          setupCanvases();
          updateMainInstruction();

          const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
          });

          hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
          });

          hands.onResults((results) => {
            drawHandResults(results);
            handleGesture(results);
          });

          const camera = new Camera(video, {
            onFrame: async () => {
              await hands.send({ image: video });
            },
            width: 1280,
            height: 720
          });

          camera.start();
        };
      } catch (err) {
        statusText.textContent = "Camera or MediaPipe failed to start.";
        alert("Error: " + err.message);
      }
    }

    thresholdValue.textContent = thresholdSlider.value;
    darkBoostValue.textContent = darkBoostSlider.value;
    noiseValue.textContent = noiseSlider.value;

    startEverything();
  </script>
</body>
</html>
