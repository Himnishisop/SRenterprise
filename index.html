<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gla Board</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  h1 {
    margin: 14px 0 5px;
    font-size: 28px;
  }

  p {
    color: #aaa;
    margin: 5px 15px 15px;
    font-size: 14px;
  }

  .section {
    width: 95%;
    max-width: 900px;
    margin: 15px auto;
    padding: 15px;
    background: #151515;
    border-radius: 14px;
    border: 1px solid #333;
  }

  .camera-box {
    position: relative;
    width: 100%;
    max-width: 850px;
    margin: auto;
  }

  video, canvas {
    width: 100%;
    max-width: 850px;
    border-radius: 12px;
    background: black;
    border: 1px solid #333;
  }

  button {
    margin: 7px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #7c3aed;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
  }

  button:hover {
    background: #9b5cff;
  }

  button.secondary {
    background: #333;
  }

  button.danger {
    background: #b91c1c;
  }

  #middleCaptureBtn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background: rgba(124, 58, 237, 0.88);
    border: 4px solid white;
    color: white;
    font-size: 17px;
    font-weight: bold;
    z-index: 10;
    box-shadow: 0 0 35px rgba(124, 58, 237, 0.9);
    backdrop-filter: blur(8px);
  }

  #middleCaptureBtn:hover {
    background: rgba(155, 92, 255, 0.95);
  }

  #middleCaptureBtn.hidden {
    display: none;
  }

  .controls {
    margin: 15px auto;
    max-width: 700px;
    text-align: left;
  }

  label {
    display: block;
    margin-top: 12px;
    color: #ccc;
    font-size: 14px;
  }

  input[type="range"] {
    width: 100%;
  }

  .status {
    color: #00ff99;
    margin-top: 10px;
    font-size: 14px;
  }

  .preview-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
  }

  @media (min-width: 800px) {
    .preview-grid {
      grid-template-columns: 1fr 1fr;
    }
  }
</style>
</head>

<body>

<h1>Gla Board</h1>
<p>Capture blank glass first, then write on glass, capture again, and convert it into a clean whiteboard.</p>

<div class="section">
  <h2>Camera</h2>

  <div class="camera-box">
    <video id="video" autoplay playsinline></video>

    <button id="middleCaptureBtn" onclick="middleCaptureAction()">
      Capture<br>Blank
    </button>
  </div>

  <br>

  <button onclick="captureBlank()">1. Capture Blank Glass</button>
  <button onclick="captureWritten()">2. Capture Written Glass</button>
  <button onclick="processBoard()">3. Make Whiteboard</button>
  <button onclick="saveWhiteboard()">Save Whiteboard</button>
  <button class="secondary" onclick="toggleMiddleButton()">Toggle Middle Button</button>
  <button class="danger" onclick="resetAll()">Reset</button>

  <div class="status" id="status">Starting camera...</div>
</div>

<div class="section">
  <h2>Adjust Detection</h2>

  <div class="controls">
    <label>Difference Sensitivity: <span id="thresholdValue">45</span></label>
    <input type="range" id="threshold" min="5" max="120" value="45" oninput="updateAndProcess()" />

    <label>Dark Ink Boost: <span id="darkBoostValue">35</span></label>
    <input type="range" id="darkBoost" min="0" max="120" value="35" oninput="updateAndProcess()" />

    <label>Noise Removal: <span id="noiseValue">2</span></label>
    <input type="range" id="noise" min="0" max="5" value="2" oninput="updateAndProcess()" />

    <label>
      <input type="checkbox" id="mirrorOutput" onchange="updateAndProcess()" />
      Mirror output
    </label>

    <label>
      <input type="checkbox" id="blackInk" checked onchange="updateAndProcess()" />
      Show writing as black ink
    </label>
  </div>
</div>

<div class="section">
  <h2>Photos</h2>

  <div class="preview-grid">
    <div>
      <h3>Blank Glass</h3>
      <canvas id="blankCanvas"></canvas>
    </div>

    <div>
      <h3>Written Glass</h3>
      <canvas id="writtenCanvas"></canvas>
    </div>
  </div>
</div>

<div class="section">
  <h2>Final Whiteboard</h2>
  <canvas id="outputCanvas"></canvas>
</div>

<script>
  const video = document.getElementById("video");
  const blankCanvas = document.getElementById("blankCanvas");
  const writtenCanvas = document.getElementById("writtenCanvas");
  const outputCanvas = document.getElementById("outputCanvas");

  const statusText = document.getElementById("status");
  const middleCaptureBtn = document.getElementById("middleCaptureBtn");

  const thresholdSlider = document.getElementById("threshold");
  const darkBoostSlider = document.getElementById("darkBoost");
  const noiseSlider = document.getElementById("noise");

  const thresholdValue = document.getElementById("thresholdValue");
  const darkBoostValue = document.getElementById("darkBoostValue");
  const noiseValue = document.getElementById("noiseValue");

  let hasBlank = false;
  let hasWritten = false;

  let captureStep = 1;
  let middleButtonVisible = true;

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;

      video.onloadedmetadata = () => {
        setupCanvases();
        statusText.textContent = "Camera ready. Tap middle button to capture blank glass.";
      };

    } catch (err) {
      statusText.textContent = "Camera failed. Use HTTPS, localhost, or allow camera permission.";
      alert("Camera error: " + err.message);
    }
  }

  function setupCanvases() {
    const w = video.videoWidth || 1280;
    const h = video.videoHeight || 720;

    [blankCanvas, writtenCanvas, outputCanvas].forEach(canvas => {
      canvas.width = w;
      canvas.height = h;
    });
  }

  function drawVideoToCanvas(canvas) {
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  }

  function middleCaptureAction() {
    if (captureStep === 1) {
      captureBlank();
      captureStep = 2;
      updateMiddleButtonText();
      return;
    }

    if (captureStep === 2) {
      captureWritten();
      captureStep = 3;
      updateMiddleButtonText();
      return;
    }

    if (captureStep === 3) {
      processBoard();
      captureStep = 1;
      updateMiddleButtonText();
      return;
    }
  }

  function updateMiddleButtonText() {
    if (captureStep === 1) {
      middleCaptureBtn.innerHTML = "Capture<br>Blank";
    }

    if (captureStep === 2) {
      middleCaptureBtn.innerHTML = "Capture<br>Written";
    }

    if (captureStep === 3) {
      middleCaptureBtn.innerHTML = "Make<br>Board";
    }
  }

  function toggleMiddleButton() {
    middleButtonVisible = !middleButtonVisible;

    if (middleButtonVisible) {
      middleCaptureBtn.classList.remove("hidden");
    } else {
      middleCaptureBtn.classList.add("hidden");
    }
  }

  function captureBlank() {
    setupCanvases();
    drawVideoToCanvas(blankCanvas);
    hasBlank = true;

    captureStep = 2;
    updateMiddleButtonText();

    statusText.textContent = "Blank glass captured. Now write on the glass without moving camera.";
  }

  function captureWritten() {
    if (!hasBlank) {
      alert("Capture blank glass first.");
      return;
    }

    drawVideoToCanvas(writtenCanvas);
    hasWritten = true;

    captureStep = 3;
    updateMiddleButtonText();

    statusText.textContent = "Written glass captured. Now click Make Whiteboard.";
  }

  function updateAndProcess() {
    thresholdValue.textContent = thresholdSlider.value;
    darkBoostValue.textContent = darkBoostSlider.value;
    noiseValue.textContent = noiseSlider.value;

    if (hasBlank && hasWritten) {
      processBoard();
    }
  }

  function processBoard() {
    if (!hasBlank || !hasWritten) {
      alert("Capture both blank and written photos first.");
      return;
    }

    const w = blankCanvas.width;
    const h = blankCanvas.height;

    const blankCtx = blankCanvas.getContext("2d");
    const writtenCtx = writtenCanvas.getContext("2d");
    const outputCtx = outputCanvas.getContext("2d");

    const blankData = blankCtx.getImageData(0, 0, w, h);
    const writtenData = writtenCtx.getImageData(0, 0, w, h);

    const outputData = outputCtx.createImageData(w, h);

    const threshold = parseInt(thresholdSlider.value);
    const darkBoost = parseInt(darkBoostSlider.value);
    const blackInk = document.getElementById("blackInk").checked;

    let mask = new Uint8Array(w * h);

    for (let i = 0; i < blankData.data.length; i += 4) {
      const index = i / 4;

      const br = blankData.data[i];
      const bg = blankData.data[i + 1];
      const bb = blankData.data[i + 2];

      const wr = writtenData.data[i];
      const wg = writtenData.data[i + 1];
      const wb = writtenData.data[i + 2];

      const blankGray = (br + bg + bb) / 3;
      const writtenGray = (wr + wg + wb) / 3;

      const diff =
        Math.abs(wr - br) +
        Math.abs(wg - bg) +
        Math.abs(wb - bb);

      const becameDarker = blankGray - writtenGray;

      if (diff > threshold || becameDarker > darkBoost) {
        mask[index] = 255;
      } else {
        mask[index] = 0;
      }
    }

    mask = cleanNoise(mask, w, h, parseInt(noiseSlider.value));

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let sourceX = x;

        if (document.getElementById("mirrorOutput").checked) {
          sourceX = w - x - 1;
        }

        const srcIndex = y * w + sourceX;
        const outIndex = (y * w + x) * 4;

        const isWriting = mask[srcIndex] > 0;

        if (isWriting) {
          if (blackInk) {
            outputData.data[outIndex] = 0;
            outputData.data[outIndex + 1] = 0;
            outputData.data[outIndex + 2] = 0;
          } else {
            outputData.data[outIndex] = 124;
            outputData.data[outIndex + 1] = 58;
            outputData.data[outIndex + 2] = 237;
          }
        } else {
          outputData.data[outIndex] = 255;
          outputData.data[outIndex + 1] = 255;
          outputData.data[outIndex + 2] = 255;
        }

        outputData.data[outIndex + 3] = 255;
      }
    }

    outputCtx.putImageData(outputData, 0, 0);

    statusText.textContent = "Whiteboard generated. Adjust sliders if detection is weak or noisy.";
  }

  function cleanNoise(mask, w, h, strength) {
    if (strength <= 0) return mask;

    let result = new Uint8Array(mask);

    for (let pass = 0; pass < strength; pass++) {
      let temp = new Uint8Array(result);

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const index = y * w + x;

          let count = 0;

          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const nIndex = (y + dy) * w + (x + dx);
              if (result[nIndex] > 0) count++;
            }
          }

          if (count <= 2) {
            temp[index] = 0;
          }

          if (count >= 5) {
            temp[index] = 255;
          }
        }
      }

      result = temp;
    }

    return result;
  }

  function saveWhiteboard() {
    if (!hasBlank || !hasWritten) {
      alert("Generate whiteboard first.");
      return;
    }

    const link = document.createElement("a");
    link.download = "gla-board-whiteboard.png";
    link.href = outputCanvas.toDataURL("image/png");
    link.click();
  }

  function resetAll() {
    const canvases = [blankCanvas, writtenCanvas, outputCanvas];

    canvases.forEach(canvas => {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    hasBlank = false;
    hasWritten = false;
    captureStep = 1;
    updateMiddleButtonText();

    statusText.textContent = "Reset done. Tap middle button to capture blank glass again.";
  }

  startCamera();
</script>

</body>
</html>
