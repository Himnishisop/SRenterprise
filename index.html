<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gla Board - Gesture Capture Fixed</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  h1 { margin: 14px 0 5px; font-size: 28px; }

  p {
    color: #aaa;
    margin: 5px 15px 15px;
    font-size: 14px;
  }

  .section {
    width: 95%;
    max-width: 900px;
    margin: 15px auto;
    padding: 15px;
    background: #151515;
    border-radius: 14px;
    border: 1px solid #333;
  }

  .camera-box {
    position: relative;
    width: 100%;
    max-width: 850px;
    margin: auto;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #333;
    background: black;
  }

  video, canvas {
    width: 100%;
    max-width: 850px;
    border-radius: 12px;
    background: black;
    border: 1px solid #333;
  }

  #video {
    display: block;
    border: none;
    border-radius: 0;
  }

  #overlayCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    pointer-events: none;
    border-radius: 0;
  }

  button {
    margin: 7px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #7c3aed;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
  }

  button:hover { background: #9b5cff; }
  button.secondary { background: #333; }
  button.danger { background: #b91c1c; }
  button.good { background: #15803d; }

  #middleCaptureBtn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 155px;
    height: 155px;
    border-radius: 50%;
    background: rgba(124, 58, 237, 0.88);
    border: 4px solid white;
    color: white;
    font-size: 18px;
    font-weight: bold;
    z-index: 10;
    box-shadow: 0 0 35px rgba(124, 58, 237, 0.9);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
    padding: 10px;
    pointer-events: none;
    user-select: none;
  }

  #middleCaptureBtn.hidden { display: none; }

  .controls {
    margin: 15px auto;
    max-width: 700px;
    text-align: left;
  }

  label {
    display: block;
    margin-top: 12px;
    color: #ccc;
    font-size: 14px;
  }

  input[type="range"] { width: 100%; }

  .status {
    color: #00ff99;
    margin-top: 10px;
    font-size: 14px;
    min-height: 22px;
  }

  .preview-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
  }

  @media (min-width: 800px) {
    .preview-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

<body>

<h1>Gla Board</h1>
<p>Show full palm first, then only index finger. It starts 3 sec timer and captures.</p>

<div class="section">
  <h2>Camera</h2>

  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
    <div id="middleCaptureBtn">Loading</div>
  </div>

  <br>

  <button class="good" onclick="enableSound()">Enable Sound</button>
  <button class="secondary" onclick="toggleMiddleButton()">Toggle Middle Button</button>
  <button onclick="manualCapture()">Manual Capture</button>
  <button onclick="saveWhiteboard()">Save Whiteboard</button>
  <button class="danger" onclick="resetAll()">Reset</button>

  <div class="status" id="status">Starting camera and hand tracking...</div>
</div>

<div class="section">
  <h2>Adjust Detection</h2>

  <div class="controls">
    <label>Difference Sensitivity: <span id="thresholdValue">45</span></label>
    <input type="range" id="threshold" min="5" max="120" value="45" oninput="updateAndProcess()" />

    <label>Dark Ink Boost: <span id="darkBoostValue">35</span></label>
    <input type="range" id="darkBoost" min="0" max="120" value="35" oninput="updateAndProcess()" />

    <label>Noise Removal: <span id="noiseValue">2</span></label>
    <input type="range" id="noise" min="0" max="5" value="2" oninput="updateAndProcess()" />

    <label>
      <input type="checkbox" id="mirrorOutput" onchange="updateAndProcess()" />
      Mirror output
    </label>

    <label>
      <input type="checkbox" id="blackInk" checked onchange="updateAndProcess()" />
      Show writing as black ink
    </label>

    <label>
      <input type="checkbox" id="showLandmarks" checked />
      Show hand landmarks
    </label>
  </div>
</div>

<div class="section">
  <h2>Photos</h2>

  <div class="preview-grid">
    <div>
      <h3>Blank Glass</h3>
      <canvas id="blankCanvas"></canvas>
    </div>

    <div>
      <h3>Written Glass</h3>
      <canvas id="writtenCanvas"></canvas>
    </div>
  </div>
</div>

<div class="section">
  <h2>Final Whiteboard</h2>
  <canvas id="outputCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const video = document.getElementById("video");
const overlayCanvas = document.getElementById("overlayCanvas");
const blankCanvas = document.getElementById("blankCanvas");
const writtenCanvas = document.getElementById("writtenCanvas");
const outputCanvas = document.getElementById("outputCanvas");

const overlayCtx = overlayCanvas.getContext("2d");
const statusText = document.getElementById("status");
const middleCaptureBtn = document.getElementById("middleCaptureBtn");

const thresholdSlider = document.getElementById("threshold");
const darkBoostSlider = document.getElementById("darkBoost");
const noiseSlider = document.getElementById("noise");

const thresholdValue = document.getElementById("thresholdValue");
const darkBoostValue = document.getElementById("darkBoostValue");
const noiseValue = document.getElementById("noiseValue");

let hasBlank = false;
let hasWritten = false;
let captureStep = 1;

let middleButtonVisible = true;
let countdownActive = false;
let armed = false;
let armedAt = 0;
let openPalmFrames = 0;
let onlyIndexFrames = 0;

const PALM_STABLE_FRAMES = 8;
const INDEX_STABLE_FRAMES = 8;
const ARM_TIMEOUT_MS = 6000;

let audioCtx = null;
let soundEnabled = false;
let lastCaptureTime = 0;

function enableSound() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    soundEnabled = true;
    beep(1000, 0.15, 0.12);
    statusText.textContent = "Sound enabled. Now gesture timer will beep.";
  } catch (err) {
    alert("Sound failed: " + err.message);
  }
}

function beep(freq = 900, duration = 0.15, volume = 0.1) {
  if (!soundEnabled || !audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.value = volume;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}

function setupCanvases() {
  const w = video.videoWidth || 1280;
  const h = video.videoHeight || 720;

  [overlayCanvas, blankCanvas, writtenCanvas, outputCanvas].forEach(canvas => {
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  });
}

function updateBubbleText(text) {
  middleCaptureBtn.innerHTML = text;
}

function toggleMiddleButton() {
  middleButtonVisible = !middleButtonVisible;
  middleCaptureBtn.classList.toggle("hidden", !middleButtonVisible);
}

function drawVideoToCanvas(canvas) {
  setupCanvases();

  const ctx = canvas.getContext("2d");

  ctx.save();

  // clear old black frame
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // important fix: draw actual current video frame
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  ctx.restore();
}

function isCanvasMostlyBlack(canvas) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;

  const small = ctx.getImageData(0, 0, Math.min(w, 80), Math.min(h, 60)).data;

  let brightness = 0;
  const pixels = small.length / 4;

  for (let i = 0; i < small.length; i += 4) {
    brightness += small[i] + small[i + 1] + small[i + 2];
  }

  const avg = brightness / pixels / 3;
  return avg < 8;
}

async function captureSafe(canvas, label) {
  if (video.readyState < 2 || video.videoWidth === 0 || video.videoHeight === 0) {
    statusText.textContent = "Video not ready. Wait 1 second.";
    await new Promise(r => setTimeout(r, 800));
  }

  // Wait for a real browser video frame
  await new Promise(resolve => {
    if ("requestVideoFrameCallback" in video) {
      video.requestVideoFrameCallback(() => resolve());
    } else {
      requestAnimationFrame(() => resolve());
    }
  });

  drawVideoToCanvas(canvas);

  // If black frame came, retry
  if (isCanvasMostlyBlack(canvas)) {
    await new Promise(r => setTimeout(r, 350));
    drawVideoToCanvas(canvas);
  }

  if (isCanvasMostlyBlack(canvas)) {
    statusText.textContent = `${label} capture failed. Camera frame was black. Try again.`;
    beep(250, 0.3, 0.12);
    return false;
  }

  return true;
}

async function manualCapture() {
  if (countdownActive) return;
  await doCapture();
}

async function doCapture() {
  const now = Date.now();

  if (now - lastCaptureTime < 1200) return;
  lastCaptureTime = now;

  setupCanvases();

  if (captureStep === 1) {
    statusText.textContent = "Capturing blank glass...";
    const ok = await captureSafe(blankCanvas, "Blank glass");

    if (!ok) return;

    hasBlank = true;
    captureStep = 2;
    resetArming();

    updateBubbleText("Blank<br>Saved");
    statusText.textContent = "Blank glass captured. Now write on glass, then palm + index again.";

    setTimeout(updateMainInstruction, 900);
  } else {
    statusText.textContent = "Capturing written glass...";
    const ok = await captureSafe(writtenCanvas, "Written glass");

    if (!ok) return;

    hasWritten = true;

    updateBubbleText("Generating");
    statusText.textContent = "Written glass captured. Generating whiteboard...";

    processBoard();

    updateBubbleText("Done");
    statusText.textContent = "Whiteboard generated. Save it or reset.";
  }
}

function updateMainInstruction() {
  if (countdownActive) return;

  if (captureStep === 1) {
    if (!armed) {
      updateBubbleText("Show<br>Palm");
      statusText.textContent = "Step 1: Show full palm to arm blank capture.";
    } else {
      updateBubbleText("Show<br>Index");
      statusText.textContent = "Armed. Now show only index finger.";
    }
  } else {
    if (!armed) {
      updateBubbleText("Show<br>Palm");
      statusText.textContent = "Step 2: Write first. Then show full palm to arm second capture.";
    } else {
      updateBubbleText("Show<br>Index");
      statusText.textContent = "Armed. Now show only index finger.";
    }
  }
}

function resetArming() {
  armed = false;
  armedAt = 0;
  openPalmFrames = 0;
  onlyIndexFrames = 0;
}

function isFingerUp(landmarks, tipIndex, pipIndex) {
  return landmarks[tipIndex].y < landmarks[pipIndex].y;
}

function distance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function detectOpenPalm(landmarks) {
  const indexUp = isFingerUp(landmarks, 8, 6);
  const middleUp = isFingerUp(landmarks, 12, 10);
  const ringUp = isFingerUp(landmarks, 16, 14);
  const pinkyUp = isFingerUp(landmarks, 20, 18);

  const handWidth = distance(landmarks[5], landmarks[17]);
  const handHeight = distance(landmarks[0], landmarks[9]);

  return indexUp && middleUp && ringUp && pinkyUp && handWidth > handHeight * 0.35;
}

function detectOnlyIndex(landmarks) {
  const indexUp = isFingerUp(landmarks, 8, 6);
  const middleUp = isFingerUp(landmarks, 12, 10);
  const ringUp = isFingerUp(landmarks, 16, 14);
  const pinkyUp = isFingerUp(landmarks, 20, 18);

  return indexUp && !middleUp && !ringUp && !pinkyUp;
}

function startCountdown() {
  if (countdownActive) return;

  countdownActive = true;
  armed = false;
  openPalmFrames = 0;
  onlyIndexFrames = 0;

  let count = 3;

  updateBubbleText(String(count));
  statusText.textContent = `Capturing ${captureStep === 1 ? "blank glass" : "written glass"} in ${count}...`;
  beep(900, 0.18, 0.12);

  const timer = setInterval(async () => {
    count--;

    if (count > 0) {
      updateBubbleText(String(count));
      statusText.textContent = `Capturing ${captureStep === 1 ? "blank glass" : "written glass"} in ${count}...`;
      beep(900, 0.18, 0.12);
    } else {
      clearInterval(timer);

      updateBubbleText("Snap!");
      statusText.textContent = "Capturing now...";
      beep(1300, 0.25, 0.14);

      setTimeout(async () => {
        await doCapture();
        countdownActive = false;
        updateMainInstruction();
      }, 250);
    }
  }, 1000);
}

function updateAndProcess() {
  thresholdValue.textContent = thresholdSlider.value;
  darkBoostValue.textContent = darkBoostSlider.value;
  noiseValue.textContent = noiseSlider.value;

  if (hasBlank && hasWritten) {
    processBoard();
  }
}

function cleanNoise(mask, w, h, strength) {
  if (strength <= 0) return mask;

  let result = new Uint8Array(mask);

  for (let pass = 0; pass < strength; pass++) {
    const temp = new Uint8Array(result);

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const index = y * w + x;
        let count = 0;

        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nIndex = (y + dy) * w + (x + dx);
            if (result[nIndex] > 0) count++;
          }
        }

        if (count <= 2) temp[index] = 0;
        if (count >= 5) temp[index] = 255;
      }
    }

    result = temp;
  }

  return result;
}

function processBoard() {
  if (!hasBlank || !hasWritten) return;

  const w = blankCanvas.width;
  const h = blankCanvas.height;

  const blankCtx = blankCanvas.getContext("2d");
  const writtenCtx = writtenCanvas.getContext("2d");
  const outputCtx = outputCanvas.getContext("2d");

  const blankData = blankCtx.getImageData(0, 0, w, h);
  const writtenData = writtenCtx.getImageData(0, 0, w, h);
  const outputData = outputCtx.createImageData(w, h);

  const threshold = parseInt(thresholdSlider.value);
  const darkBoost = parseInt(darkBoostSlider.value);
  const blackInk = document.getElementById("blackInk").checked;
  const mirrorOutput = document.getElementById("mirrorOutput").checked;

  let mask = new Uint8Array(w * h);

  for (let i = 0; i < blankData.data.length; i += 4) {
    const index = i / 4;

    const br = blankData.data[i];
    const bg = blankData.data[i + 1];
    const bb = blankData.data[i + 2];

    const wr = writtenData.data[i];
    const wg = writtenData.data[i + 1];
    const wb = writtenData.data[i + 2];

    const blankGray = (br + bg + bb) / 3;
    const writtenGray = (wr + wg + wb) / 3;

    const diff =
      Math.abs(wr - br) +
      Math.abs(wg - bg) +
      Math.abs(wb - bb);

    const becameDarker = blankGray - writtenGray;

    if (diff > threshold || becameDarker > darkBoost) {
      mask[index] = 255;
    } else {
      mask[index] = 0;
    }
  }

  mask = cleanNoise(mask, w, h, parseInt(noiseSlider.value));

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sourceX = x;
      if (mirrorOutput) sourceX = w - x - 1;

      const srcIndex = y * w + sourceX;
      const outIndex = (y * w + x) * 4;
      const isWriting = mask[srcIndex] > 0;

      if (isWriting) {
        if (blackInk) {
          outputData.data[outIndex] = 0;
          outputData.data[outIndex + 1] = 0;
          outputData.data[outIndex + 2] = 0;
        } else {
          outputData.data[outIndex] = 124;
          outputData.data[outIndex + 1] = 58;
          outputData.data[outIndex + 2] = 237;
        }
      } else {
        outputData.data[outIndex] = 255;
        outputData.data[outIndex + 1] = 255;
        outputData.data[outIndex + 2] = 255;
      }

      outputData.data[outIndex + 3] = 255;
    }
  }

  outputCtx.putImageData(outputData, 0, 0);
}

function saveWhiteboard() {
  if (!hasBlank || !hasWritten) {
    alert("Capture both photos first.");
    return;
  }

  const link = document.createElement("a");
  link.download = "gla-board-whiteboard.png";
  link.href = outputCanvas.toDataURL("image/png");
  link.click();
}

function resetAll() {
  [blankCanvas, writtenCanvas, outputCanvas, overlayCanvas].forEach(canvas => {
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  hasBlank = false;
  hasWritten = false;
  captureStep = 1;
  countdownActive = false;
  resetArming();

  updateBubbleText("Show<br>Palm");
  statusText.textContent = "Reset done. Show palm to start again.";
}

function drawHandResults(results) {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  if (!document.getElementById("showLandmarks").checked) return;
  if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) return;

  for (const landmarks of results.multiHandLandmarks) {
    drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS, {
      color: "#00FF99",
      lineWidth: 3
    });

    drawLandmarks(overlayCtx, landmarks, {
      color: "#7c3aed",
      lineWidth: 1,
      radius: 4
    });
  }
}

function handleGesture(results) {
  if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
    openPalmFrames = 0;
    onlyIndexFrames = 0;

    if (armed && Date.now() - armedAt > ARM_TIMEOUT_MS) {
      resetArming();
      updateMainInstruction();
    }

    return;
  }

  if (countdownActive) return;

  const landmarks = results.multiHandLandmarks[0];
  const isPalm = detectOpenPalm(landmarks);
  const isOnlyIdx = detectOnlyIndex(landmarks);

  if (!armed) {
    if (isPalm) {
      openPalmFrames++;

      if (openPalmFrames >= PALM_STABLE_FRAMES) {
        armed = true;
        armedAt = Date.now();
        openPalmFrames = 0;
        onlyIndexFrames = 0;

        beep(700, 0.12, 0.1);
        updateMainInstruction();
      }
    } else {
      openPalmFrames = 0;
    }
  } else {
    if (Date.now() - armedAt > ARM_TIMEOUT_MS) {
      resetArming();
      updateMainInstruction();
      return;
    }

    if (isOnlyIdx) {
      onlyIndexFrames++;

      if (onlyIndexFrames >= INDEX_STABLE_FRAMES) {
        onlyIndexFrames = 0;
        startCountdown();
      }
    } else {
      onlyIndexFrames = 0;
    }
  }
}

async function startEverything() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    video.onloadedmetadata = async () => {
      setupCanvases();

      const hands = new Hands({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      hands.onResults(results => {
        setupCanvases();
        drawHandResults(results);
        handleGesture(results);
      });

      const camera = new Camera(video, {
        onFrame: async () => {
          if (video.readyState >= 2) {
            await hands.send({ image: video });
          }
        },
        width: 1280,
        height: 720
      });

      camera.start();

      updateBubbleText("Show<br>Palm");
      statusText.textContent = "Camera ready. Click Enable Sound once, then show palm.";
    };
  } catch (err) {
    statusText.textContent = "Camera or MediaPipe failed.";
    alert("Error: " + err.message);
  }
}

thresholdValue.textContent = thresholdSlider.value;
darkBoostValue.textContent = darkBoostSlider.value;
noiseValue.textContent = noiseSlider.value;

startEverything();
</script>

</body>
</html>
